name: Cleanup Pull Request Preview

on:
    pull_request:
        types: [closed]

permissions:
    contents: read

jobs:
    cleanup:
        if: github.event.pull_request.head.repo.full_name == github.repository
        runs-on: ubuntu-latest
        steps:
            - name: Checkout preview repository
              uses: actions/checkout@v7
              with:
                  repository: geo-engine/geoengine.de-previews
                  ssh-key: ${{ secrets.PREVIEW_DEPLOY_KEY }}
                  path: previews

            - name: Remove closed pull request preview
              working-directory: previews
              env:
                  PREVIEW_NUMBER: ${{ github.event.pull_request.number }}
              run: |
                  preview_dir="pr-$PREVIEW_NUMBER"
                  if [ -d "$preview_dir" ]; then
                      rm -rf "$preview_dir"
                      git config user.name "github-actions[bot]"
                      git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
                      git add -A
                      git commit -m "Remove preview for closed PR #$PREVIEW_NUMBER"
                      preview_branch="$(git branch --show-current)"
                      for attempt in 1 2 3; do
                          if git push origin "HEAD:refs/heads/$preview_branch"; then
                              break
                          fi
                          if [ "$attempt" -eq 3 ]; then
                              echo "Failed to remove preview after $attempt attempts" >&2
                              exit 1
                          fi
                          git fetch origin "$preview_branch"
                          git rebase FETCH_HEAD
                      done
                  fi
