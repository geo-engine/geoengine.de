name: Publish Pull Request Preview

on:
    workflow_run:
        workflows: [Check]
        types: [completed]

permissions:
    contents: read
    pull-requests: write

jobs:
    publish:
        if: github.event.workflow_run.event == 'pull_request' && github.event.workflow_run.conclusion == 'success'
        runs-on: ubuntu-latest

        steps:
            - name: Get pull request number
              id: pr
              env:
                  GH_TOKEN: ${{ github.token }}
              run: |
                  number=$(gh api "/repos/${GITHUB_REPOSITORY}/actions/runs/${{ github.event.workflow_run.id }}" --jq '.pull_requests[0].number')
                  if [ -z "$number" ] || [ "$number" = "null" ]; then
                      echo "No pull request associated with this workflow run" >&2
                      exit 1
                  fi
                  echo "number=$number" >> "$GITHUB_OUTPUT"

            - name: Download pull request build
              uses: actions/download-artifact@v4
              with:
                  name: preview-${{ steps.pr.outputs.number }}
                  path: preview
                  github-token: ${{ github.token }}
                  run-id: ${{ github.event.workflow_run.id }}

            - name: Checkout preview repository
              uses: actions/checkout@v7
              with:
                  repository: geo-engine/geoengine.de-previews
                  ssh-key: ${{ secrets.PREVIEW_DEPLOY_KEY }}
                  path: previews

            - name: Publish preview
              id: publish
              working-directory: previews
              env:
                  PREVIEW_NUMBER: ${{ steps.pr.outputs.number }}
                  PREVIEW_REPOSITORY: geo-engine/geoengine.de-previews
              run: |
                  preview_dir="pr-$PREVIEW_NUMBER"
                  rm -rf "$preview_dir"
                  mkdir -p "$preview_dir"
                  cp -a "${GITHUB_WORKSPACE}/preview/." "$preview_dir/"
                  git config user.name "github-actions[bot]"
                  git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
                  git add -A
                  if git diff --cached --quiet; then
                      echo "Preview $preview_dir is unchanged"
                  else
                      git commit -m "Update preview for PR #$PREVIEW_NUMBER"
                      git push
                  fi
                  echo "url=https://geo-engine.github.io/${PREVIEW_REPOSITORY##*/}/$preview_dir/" >> "$GITHUB_OUTPUT"

            - name: Comment on pull request
              env:
                  GH_TOKEN: ${{ github.token }}
                  PREVIEW_URL: ${{ steps.publish.outputs.url }}
                  PREVIEW_NUMBER: ${{ steps.pr.outputs.number }}
              run: |
                  gh pr comment "$PREVIEW_NUMBER" --repo "${GITHUB_REPOSITORY}" --body "Website preview: $PREVIEW_URL"
